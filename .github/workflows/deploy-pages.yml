name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the published site free of non-site files
        run: rm -rf workflow

      - name: Fetch ship art
        run: |
          set -eu
          mkdir -p assets/market-images
          SHA=fa3dc2c8c608b7cff79011b013843b74473efd71
          BASE="https://raw.githubusercontent.com/darkace1998/Dreadnought-Revival-project/$SHA/data/market-images"
          for img in UI_DreadnoughtM_Morningstar UI_DreadnoughtL_Leviathan UI_DreadnoughtH_Trident \
                     UI_AssaultM_Autumn UI_AssaultH_Huscarl UI_ScoutM_Phoenix \
                     UI_SniperM_Artemis UI_SupportM_Nereid; do
            curl --fail --silent --show-error --location -o "assets/market-images/$img.png" "$BASE/$img.png"
            test -s "assets/market-images/$img.png"
          done
          echo "Ship art fetched"

      - name: Validate site
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f 404.html
          test -s assets/market-images/UI_DreadnoughtM_Morningstar.png
          python3 -m json.tool data/patch-notes.json > /dev/null
          echo "Site files OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert-on-failure:
    if: failure()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TITLE="[workflow failure] ${{ github.workflow }}"
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1 || true)
          if [ -n "$OPEN" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$OPEN/comments" -f body="Failed again: $RUN_URL"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="The [${{ github.workflow }} run]($RUN_URL) failed. Auto-opened for tracking; the Vibe daily ops run will pick it up."
          fi
