name: Update patch notes

on:
  schedule:
    # hourly; the script only picks up commits newer than the last stored entry
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-patch-notes]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate data/patch-notes.json from server and launcher commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_patch_notes.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patch-notes.json
          if git diff --cached --quiet; then
            echo "No patch-note changes"
          else
            git commit -m "docs(page): refresh patch notes from server and launcher commits"
            git push
          fi

  alert-on-failure:
    if: failure()
    needs: [update]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TITLE="[workflow failure] ${{ github.workflow }}"
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1 || true)
          if [ -n "$OPEN" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$OPEN/comments" -f body="Failed again: $RUN_URL"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="The [${{ github.workflow }} run]($RUN_URL) failed. Auto-opened for tracking; the Vibe daily ops run will pick it up."
          fi
