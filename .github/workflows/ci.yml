name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic sanity checks
        run: |
          set -e
          test -f README.md && echo "README.md OK"
          find . -type f -size +10M -not -path "./.git/*" | tee /tmp/large_files
          test ! -s /tmp/large_files && echo "No accidentally large files"
